name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Manual run from the Actions tab (useful if a PR event was missed).
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: cd supabase/functions && deno lint && deno check .
      - run: cd supabase/functions && deno test --allow-env _shared/luna-whatsapp-batch_test.ts _shared/whatsapp-interactive-buttons_test.ts
      # Match Supabase GitHub Integration: it runs `deno bundle --frozen` per
      # function. `deno check` can pass with a stale/incomplete deno.lock.
      - name: Frozen-bundle edge function entrypoints
        run: |
          set -euo pipefail
          cd supabase/functions
          mkdir -p /tmp/fn-bundles
          fail=0
          while IFS= read -r rel; do
            name="${rel%%/*}"
            echo "::group::bundle $name ($rel)"
            if ! deno bundle --import-map=deno.json --frozen "$rel" \
              -o "/tmp/fn-bundles/${name}.js"; then
              echo "::error::frozen bundle failed for $name — same failure mode as Supabase Deploy Functions (exit 10)"
              fail=1
            fi
            echo "::endgroup::"
          done < <(
            sed -n 's/^entrypoint *= *"\.\/functions\/\(.*\)"/\1/p' \
              ../config.toml | sort -u
          )
          exit "$fail"
      # Match Integration migration gate: every remote schema_migrations version
      # must exist as a file under supabase/migrations/ (PR #38 failure mode).
      - name: Migration history matches remote
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: bash scripts/check-migrations.sh
      - run: cd plugin && deno lint && deno check .
